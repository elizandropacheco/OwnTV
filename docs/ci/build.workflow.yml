name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Build
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OwnTV-apks
          path: |
            releases/**/*.apk
            releases/**/SHA256SUMS.txt
            releases/**/build-info.json

  webos-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix webos --ignore-scripts
      - run: npm test --prefix webos
      - run: python3 webos/tests/bridge_test.py
      - run: python3 scripts/check-public-assets.py
